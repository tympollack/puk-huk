name: puk_huk
description: Real-time multiplayer digital shuffleboard game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Game Engine ──────────────────────────────────────────────────────────
  flame: ^1.19.0               # Core 2D game engine
  flame_forge2d: ^0.19.0       # Box2D physics (velocity, collisions, damping)

  # ─── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # ─── Navigation ───────────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ─── Backend (Supabase — mirrors WSW hub architecture) ───────────────────
  supabase_flutter: ^2.8.0      # Auth, Postgres DB, and Realtime (Broadcast + Postgres Changes)

  # ─── UI / Animations ──────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # ─── Utilities ────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  logger: ^2.3.0
  collection: ^1.18.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Orbitron
      # fonts:
        # - asset: assets/fonts/Orbitron-Regular.ttf
        # - asset: assets/fonts/Orbitron-Bold.ttf
          # weight: 700


